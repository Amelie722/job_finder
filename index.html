<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 채용공고</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body { margin: 0; color: #172033; background: #f7f8fa; font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .site-header { height: 72px; padding: 0 max(24px, calc((100vw - 1280px) / 2)); display: flex; align-items: center; justify-content: space-between; color: #fff; background: #102b55; }
      .brand { margin: 0; font-size: 23px; letter-spacing: -0.05em; }
      .site-header nav { display: flex; gap: 32px; font-size: 15px; font-weight: 700; color: #d7e1f2; }
      .site-header nav span:first-child { color: #fff; }
      .site-header .nav-button { width: auto; min-width: 0; height: auto; padding: 0; color: #d7e1f2; background: transparent; font-size: 15px; font-weight: 700; }
      .site-header .nav-button.active { color: #fff; }
      main { width: min(100% - 48px, 1280px); margin: 0 auto; padding: 62px 0 88px; }
      .page-intro { display: flex; align-items: end; justify-content: space-between; margin-bottom: 28px; }
      h1 { margin: 0; font-size: clamp(34px, 4vw, 46px); letter-spacing: -0.06em; }
      .page-intro p { margin: 10px 0 0; color: #64748b; font-size: 16px; }
      .search-panel { padding: 24px; border: 1px solid #dbe3ed; border-radius: 16px; background: #fff; box-shadow: 0 8px 24px rgba(31, 49, 79, 0.05); }
      .fields { display: grid; grid-template-columns: 1.15fr 1fr 1fr 1.25fr auto; gap: 14px; align-items: end; }
      label { display: grid; gap: 9px; color: #475569; font-size: 13px; font-weight: 800; }
      input, select { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #cbd5e1; border-radius: 9px; color: #172033; background: #fff; font: inherit; outline: none; }
      input:focus, select:focus { border-color: #16718a; box-shadow: 0 0 0 3px rgba(22, 113, 138, 0.12); }
      .keyword-field { display: contents; }
      button { height: 48px; min-width: 102px; border: 0; border-radius: 9px; color: #fff; background: #126b84; font: inherit; font-weight: 800; cursor: pointer; }
      button:hover { background: #0d5267; }
      .jobs { margin-top: 54px; }
      .results-heading { display: flex; align-items: end; justify-content: space-between; padding-bottom: 17px; border-bottom: 2px solid #1e293b; }
      .jobs h2 { margin: 0; font-size: 26px; letter-spacing: -0.045em; }
      .jobs-summary { margin: 7px 0 0; color: #64748b; font-size: 14px; }
      .job-list { display: grid; border-bottom: 1px solid #dbe3ed; background: #fff; }
      .job-card { display: grid; grid-template-columns: minmax(0, 1fr) 190px 145px; gap: 24px; align-items: center; padding: 25px 22px; border: 1px solid #dbe3ed; border-bottom: 0; background: #fff; }
      .job-card[hidden] { display: none; }
      .job-card:hover { background: #f8fcfd; }
      .job-main { grid-column: 1; }
      .organization { margin: 0 0 8px; color: #126b84; font-size: 14px; font-weight: 800; }
      .job-card h3 { margin: 0; font-size: 18px; line-height: 1.45; letter-spacing: -0.025em; }
      .recommendation-reason { margin: 10px 0 0; color: #16718a; font-size: 13px; font-weight: 700; }
      .job-details { display: contents; color: #526174; font-size: 14px; }
      .job-details span:first-child { grid-column: 2; }
      .job-details span:last-child { grid-column: 3; }
      .source-link { grid-column: 3; color: #126b84; font-size: 14px; font-weight: 800; text-underline-offset: 3px; }
      .job-actions { grid-column: 3; display: grid; gap: 10px; justify-items: start; }
      .job-actions .source-link { grid-column: auto; }
      .scrap-button { width: auto; min-width: 68px; height: 34px; padding: 0 13px; border: 1px solid #126b84; border-radius: 7px; color: #126b84; background: #fff; font-size: 13px; }
      .scrap-button:hover, .scrap-button:disabled { color: #fff; background: #126b84; }
      .page[hidden] { display: none; }
      .board-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 38px; }
      .board-form { padding: 24px; border: 1px solid #dbe3ed; border-radius: 14px; background: #fff; }
      .board-form h2, .board-list h2 { margin: 0 0 8px; font-size: 26px; letter-spacing: -0.045em; }
      .board-form p { margin: 0 0 20px; color: #64748b; font-size: 14px; line-height: 1.6; }
      .board-form textarea { min-height: 160px; padding: 14px; resize: vertical; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; }
      .board-form input, .board-form textarea { width: 100%; }
      .board-form button { margin-top: 18px; }
      .board-list { display: grid; gap: 0; border-top: 2px solid #1e293b; }
      .board-post { padding: 22px 0; border-bottom: 1px solid #dbe3ed; }
      .board-post h3 { margin: 0 0 9px; font-size: 18px; }
      .board-post p { margin: 0; color: #475569; white-space: pre-wrap; line-height: 1.65; }
      .board-post footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; color: #94a3b8; font-size: 13px; }
      .board-post footer div { display: flex; gap: 8px; }
      .board-post footer button { width: auto; min-width: 54px; height: 32px; margin: 0; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 7px; color: #475569; background: #fff; font-size: 12px; }
      .board-post footer button:hover { color: #fff; background: #475569; }
      @media (max-width: 900px) { .fields { grid-template-columns: repeat(2, 1fr); } .keyword-field { display: grid; } button { width: 100%; } .job-card { grid-template-columns: 1fr 150px; } .job-details span:last-child, .job-actions { grid-column: 2; } .board-layout { grid-template-columns: 1fr; } }
      @media (max-width: 640px) { .site-header { height: 58px; } .site-header nav { display: none; } main { width: min(100% - 32px, 1280px); padding-top: 40px; } .page-intro { display: block; } .fields { grid-template-columns: 1fr; } .job-card { grid-template-columns: 1fr; gap: 10px; } .job-details span:first-child, .job-details span:last-child, .job-actions { grid-column: 1; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <header class="site-header">
      <h2 class="brand">내 채용공고</h2>
      <nav aria-label="주 메뉴"><span>채용정보</span><span>커리어 가이드</span><span>기업 탐색</span><button id="scraps-menu" class="nav-button" type="button">담은 공고</button><button id="board-menu" class="nav-button" type="button">고민 게시판</button></nav>
    </header>
    <main>
      <section id="jobs-page" class="page">
      <div class="page-intro">
        <div><h1>나에게 맞는 공고를 찾아보세요</h1><p>관심 조건에 맞춰 공공기관 채용 공고를 한눈에 확인할 수 있어요.</p></div>
      </div>
      <section class="search-panel" aria-label="공고 검색">
      <div class="fields">
        <label>
          학과
          <input type="text" name="department" placeholder="학과 입력" />
        </label>
        <label>
          희망 지역
          <select id="location" name="location">
            <option value="">전체 지역</option>
            <option value="대전">대전</option>
            <option value="세종">세종</option>
            <option value="충남">충남</option>
            <option value="서울">서울</option>
            <option value="부산">부산</option>
          </select>
        </label>
        <label>
          졸업 시기
          <input type="text" name="graduation" placeholder="졸업 시기 입력" />
        </label>
        <label class="keyword-field">
          공고 검색어
          <input id="keyword" type="text" name="keyword" placeholder="예: 인턴, 기획" />
        </label>
        <button id="search-button" type="button">검색</button>
      </div>
      </section>

      <section class="jobs" aria-labelledby="job-list-title">
        <div class="results-heading"><div><h2 id="job-list-title">공고 목록</h2><p class="jobs-summary">조건에 맞는 채용 공고를 확인해 보세요.</p></div></div>
        <div class="job-list"></div>
      </section>
      </section>
      <section id="board-page" class="page" hidden>
        <div class="page-intro"><div><h1>익명 고민 게시판</h1><p>취업 준비와 대학 생활의 고민을 익명으로 나눠보세요.</p></div></div>
        <div class="board-layout">
          <section class="board-list" aria-labelledby="board-title"><h2 id="board-title">최근 글</h2><div id="board-posts"></div></section>
          <form id="board-form" class="board-form"><h2 id="board-form-heading">글쓰기</h2><p>수정·삭제할 때 사용할 비밀번호를 입력해 주세요. 비밀번호는 암호화되어 저장됩니다.</p><label>제목<input id="board-title-input" maxlength="100" required /></label><label>내용<textarea id="board-content-input" maxlength="3000" required></textarea></label><label>비밀번호<input id="board-password-input" type="password" minlength="4" required /></label><button id="board-submit-button" type="submit">익명으로 등록</button><button id="board-cancel-button" type="button" hidden>수정 취소</button></form>
        </div>
      </section>
    </main>
    <script>
      const supabaseClient = supabase.createClient(
        "https://lmrofzagspaopbdiqcft.supabase.co",
        "sb_publishable_Ejkkjy_aTlARuyhlVGOVig_gy_i0ICI"
      );
      const locationSelect = document.querySelector("#location");
      const keywordInput = document.querySelector("#keyword");
      const searchButton = document.querySelector("#search-button");
      const jobList = document.querySelector(".job-list");
      const scrapsMenu = document.querySelector("#scraps-menu");
      const boardMenu = document.querySelector("#board-menu");
      const jobsPage = document.querySelector("#jobs-page");
      const boardPage = document.querySelector("#board-page");
      const boardPosts = document.querySelector("#board-posts");
      const boardForm = document.querySelector("#board-form");
      const boardFormHeading = document.querySelector("#board-form-heading");
      const boardTitleInput = document.querySelector("#board-title-input");
      const boardContentInput = document.querySelector("#board-content-input");
      const boardPasswordInput = document.querySelector("#board-password-input");
      const boardSubmitButton = document.querySelector("#board-submit-button");
      const boardCancelButton = document.querySelector("#board-cancel-button");
      const priorityRegions = ["대전", "세종", "충남"];
      let showingScraps = false;
      let savedJobIds = new Set();

      function createTextElement(tagName, className, text) {
        const element = document.createElement(tagName);
        element.className = className;
        element.textContent = text || "";
        return element;
      }

      function renderJobs(jobs) {
        jobs.forEach((job) => {
          const card = document.createElement("article");
          card.className = "job-card";
          card.dataset.region = job.workrgnnmlst || "";
          card.dataset.jobId = job.recrutpblntsn || "";
          card.dataset.remote = "";
          card.dataset.job = "";
          card.dataset.duties = "";

          const organization = createTextElement("p", "organization", job.instnm);
          const title = createTextElement("h3", "", job.recrutpbancttl);
          const reason = createTextElement("p", "recommendation-reason", "");
          const mainInfo = document.createElement("div");
          mainInfo.className = "job-main";
          mainInfo.append(organization, title, reason);
          const details = document.createElement("div");
          details.className = "job-details";
          details.append(
            createTextElement("span", "", `근무지역: ${job.workrgnnmlst || ""}`),
            createTextElement("span", "", `마감일: ${job.pbancendymd || ""}`)
          );

          const source = job.srcurl
            ? Object.assign(document.createElement("a"), {
                className: "source-link",
                href: job.srcurl,
                target: "_blank",
                rel: "noreferrer",
                textContent: "원문 링크",
            })
            : createTextElement("span", "source-link", "");
          const isSaved = savedJobIds.has(Number(job.recrutpblntsn));
          const scrapButton = createTextElement("button", "scrap-button", isSaved ? "담김" : "담기");
          scrapButton.type = "button";
          scrapButton.dataset.jobId = job.recrutpblntsn || "";
          scrapButton.dataset.scrapped = String(isSaved);
          const actions = document.createElement("div");
          actions.className = "job-actions";
          actions.append(source, scrapButton);

          card.append(mainInfo, details, actions);
          jobList.append(card);
        });
      }

      function getRecommendation(card) {
        const reasons = [];
        let score = 0;
        const keyword = keywordInput.value.trim().toLowerCase();

        if (priorityRegions.includes(card.dataset.region)) {
          score += 1;
          reasons.push("지역 우선 규칙");
        } else if (card.dataset.remote === "true") {
          score += 1;
          reasons.push("지역 외 재택 가능 규칙");
        }

        const searchableText = [
          card.querySelector("h3").textContent,
          card.dataset.job,
          card.dataset.duties,
        ]
          .join(" ")
          .toLowerCase();

        if (keyword && searchableText.includes(keyword)) {
          score += 1;
          reasons.push("검색 키워드 일치 규칙");
        }

        return { score, reasons };
      }

      function applyFiltersAndRecommendations() {
        const selectedLocation = locationSelect.value;
        const jobCards = Array.from(jobList.querySelectorAll(".job-card"));
        const rankedCards = jobCards
          .map((card, index) => ({ card, index, ...getRecommendation(card) }))
          .sort((a, b) => b.score - a.score || a.index - b.index);

        rankedCards.forEach(({ card, reasons }) => {
          const jobRegions = card.dataset.region
            .split(",")
            .map((region) => region.trim());
          const isOutsideSelectedRegion = selectedLocation !== "" && !jobRegions.includes(selectedLocation);
          const isNotScrapped = showingScraps && !savedJobIds.has(Number(card.dataset.jobId));
          card.hidden = isOutsideSelectedRegion || isNotScrapped;
          const reasonElement = card.querySelector(".recommendation-reason");
          reasonElement.hidden = reasons.length === 0;
          reasonElement.textContent = reasons.length ? `추천 이유: ${reasons.join(" · ")}` : "";
          jobList.append(card);
        });
      }

      searchButton.addEventListener("click", () => {
        applyFiltersAndRecommendations();
      });

      jobList.addEventListener("click", async (event) => {
        const button = event.target.closest(".scrap-button");
        if (!button || !button.dataset.jobId) return;

        button.disabled = true;
        const jobId = Number(button.dataset.jobId);
        const isScrapped = button.dataset.scrapped === "true";
        button.textContent = isScrapped ? "취소 중" : "담는 중";
        const { error } = isScrapped
          ? await supabaseClient.from("scraps").delete().eq("job_recrutpblntsn", jobId)
          : await supabaseClient.from("scraps").insert({ job_recrutpblntsn: jobId });

        const canIgnoreDuplicate = !isScrapped && error?.code === "23505";
        if (error && !canIgnoreDuplicate) {
          button.disabled = false;
          button.textContent = isScrapped ? "담김" : "담기";
          alert(isScrapped ? "담은 공고를 취소하지 못했습니다." : "공고를 담지 못했습니다.");
          return;
        }

        const nowScrapped = !isScrapped;
        button.disabled = false;
        button.dataset.scrapped = String(nowScrapped);
        button.textContent = nowScrapped ? "담김" : "담기";
        if (nowScrapped) savedJobIds.add(jobId);
        else savedJobIds.delete(jobId);
        if (showingScraps) applyFiltersAndRecommendations();
      });

      scrapsMenu.addEventListener("click", async () => {
        if (showingScraps) {
          showingScraps = false;
          scrapsMenu.classList.remove("active");
          scrapsMenu.textContent = "담은 공고";
          applyFiltersAndRecommendations();
          return;
        }

        const { data, error } = await supabaseClient
          .from("scraps")
          .select("job_recrutpblntsn");
        if (error) {
          alert("담은 공고를 불러오지 못했습니다.");
          return;
        }

        savedJobIds = new Set(data.map((scrap) => Number(scrap.job_recrutpblntsn)));
        showingScraps = true;
        scrapsMenu.classList.add("active");
        scrapsMenu.textContent = "전체 공고";
        applyFiltersAndRecommendations();
      });

      function formatBoardDate(value) {
        return new Intl.DateTimeFormat("ko-KR", { dateStyle: "medium", timeStyle: "short" }).format(new Date(value));
      }

      function resetBoardForm() {
        boardForm.reset();
        delete boardForm.dataset.editId;
        boardFormHeading.textContent = "글쓰기";
        boardSubmitButton.textContent = "익명으로 등록";
        boardCancelButton.hidden = true;
      }

      function renderBoardPosts(posts) {
        boardPosts.replaceChildren();
        if (!posts.length) {
          boardPosts.textContent = "아직 작성된 고민이 없습니다. 첫 글을 남겨 보세요.";
          return;
        }
        posts.forEach((post) => {
          const article = document.createElement("article");
          article.className = "board-post";
          const title = createTextElement("h3", "", post.title);
          const content = createTextElement("p", "", post.content);
          const date = createTextElement("span", "", formatBoardDate(post.created_at));
          const controls = document.createElement("div");
          const edit = createTextElement("button", "", "수정");
          edit.type = "button";
          edit.dataset.action = "edit";
          edit.dataset.id = post.id;
          const remove = createTextElement("button", "", "삭제");
          remove.type = "button";
          remove.dataset.action = "delete";
          remove.dataset.id = post.id;
          controls.append(edit, remove);
          const footer = document.createElement("footer");
          footer.append(date, controls);
          article.append(title, content, footer);
          boardPosts.append(article);
        });
      }

      async function loadBoardPosts() {
        boardPosts.textContent = "게시글을 불러오는 중입니다.";
        const { data, error } = await supabaseClient.rpc("list_board_posts");
        if (error) {
          console.error(error);
          boardPosts.textContent = "게시글을 불러오지 못했습니다.";
          return;
        }
        renderBoardPosts(data || []);
      }

      function showBoard() {
        jobsPage.hidden = true;
        boardPage.hidden = false;
        boardMenu.classList.add("active");
        boardMenu.textContent = "채용 공고";
        loadBoardPosts();
      }

      function showJobs() {
        boardPage.hidden = true;
        jobsPage.hidden = false;
        boardMenu.classList.remove("active");
        boardMenu.textContent = "고민 게시판";
      }

      boardMenu.addEventListener("click", () => {
        if (boardPage.hidden) showBoard();
        else showJobs();
      });

      boardForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const isEditing = Boolean(boardForm.dataset.editId);
        boardSubmitButton.disabled = true;
        boardSubmitButton.textContent = isEditing ? "저장 중" : "등록 중";
        const params = {
          p_title: boardTitleInput.value.trim(),
          p_content: boardContentInput.value.trim(),
          p_password: boardPasswordInput.value,
        };
        if (isEditing) params.p_id = Number(boardForm.dataset.editId);
        const { error } = await supabaseClient.rpc(isEditing ? "update_board_post" : "create_board_post", params);
        if (error) {
          console.error(error);
          alert(isEditing ? "수정하지 못했습니다. 비밀번호를 확인해 주세요." : "글을 등록하지 못했습니다.");
        } else {
          resetBoardForm();
          await loadBoardPosts();
        }
        boardSubmitButton.disabled = false;
        if (!boardForm.dataset.editId) boardSubmitButton.textContent = "익명으로 등록";
      });

      boardCancelButton.addEventListener("click", resetBoardForm);

      boardPosts.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const postId = Number(button.dataset.id);
        if (button.dataset.action === "edit") {
          const post = button.closest(".board-post");
          boardForm.dataset.editId = String(postId);
          boardTitleInput.value = post.querySelector("h3").textContent;
          boardContentInput.value = post.querySelector("p").textContent;
          boardPasswordInput.value = "";
          boardFormHeading.textContent = "글 수정";
          boardSubmitButton.textContent = "수정 저장";
          boardCancelButton.hidden = false;
          boardTitleInput.focus();
          return;
        }
        const password = window.prompt("삭제하려면 작성할 때 사용한 비밀번호를 입력하세요.");
        if (!password) return;
        button.disabled = true;
        const { error } = await supabaseClient.rpc("delete_board_post", { p_id: postId, p_password: password });
        if (error) {
          console.error(error);
          alert("삭제하지 못했습니다. 비밀번호를 확인해 주세요.");
          button.disabled = false;
          return;
        }
        await loadBoardPosts();
      });

      Promise.all([
        supabaseClient.from("jobs").select("*").order("pbancendymd", { ascending: true }),
        supabaseClient.from("scraps").select("job_recrutpblntsn"),
      ])
        .then(([jobsResult, scrapsResult]) => {
          if (jobsResult.error) throw jobsResult.error;
          if (scrapsResult.error) throw scrapsResult.error;
          savedJobIds = new Set((scrapsResult.data || []).map((scrap) => Number(scrap.job_recrutpblntsn)));
          renderJobs(jobsResult.data || []);
          applyFiltersAndRecommendations();
        })
        .catch(() => {
          jobList.textContent = "공고 정보를 불러오지 못했습니다.";
        });
    </script>
  </body>
</html>
