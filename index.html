<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 채용공고</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #172033;
        background: #f3f6fb;
        font-family: Pretendard, "Noto Sans KR", Arial, sans-serif;
      }

      main {
        width: min(100%, 720px);
        padding: 48px;
        border: 1px solid #e2e8f2;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(31, 49, 79, 0.09);
      }

      h1 {
        margin: 0 0 32px;
        font-size: clamp(30px, 5vw, 44px);
        letter-spacing: -0.04em;
      }

      .fields {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      label {
        display: grid;
        gap: 9px;
        color: #4c5870;
        font-size: 14px;
        font-weight: 700;
      }

      input,
      select {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid #ccd5e3;
        border-radius: 12px;
        color: #172033;
        background: #ffffff;
        font: inherit;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #315ee9;
        box-shadow: 0 0 0 3px rgba(49, 94, 233, 0.12);
      }

      button {
        width: 100%;
        height: 52px;
        margin-top: 24px;
        border: 0;
        border-radius: 13px;
        color: #ffffff;
        background: #315ee9;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      .jobs {
        margin-top: 44px;
      }

      .jobs h2 {
        margin: 0 0 16px;
        font-size: 21px;
        letter-spacing: -0.03em;
      }

      .job-list {
        display: grid;
        gap: 12px;
      }

      .job-card {
        padding: 22px;
        border: 1px solid #e2e8f2;
        border-radius: 16px;
        background: #fbfcff;
      }

      .organization {
        margin: 0 0 7px;
        color: #315ee9;
        font-size: 14px;
        font-weight: 800;
      }

      .job-card h3 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.025em;
      }

      .job-details {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        margin: 16px 0;
        color: #58657b;
        font-size: 14px;
      }

      .source-link {
        color: #315ee9;
        font-size: 14px;
        font-weight: 800;
        text-underline-offset: 3px;
      }

      .keyword-field {
        margin-top: 16px;
      }

      .recommendation-reason {
        margin: 0 0 14px;
        color: #315ee9;
        font-size: 13px;
        font-weight: 800;
      }

      @media (max-width: 640px) {
        main {
          padding: 32px 24px;
        }

        .fields {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>내 채용공고</h1>
      <div class="fields">
        <label>
          학과
          <input type="text" name="department" placeholder="학과 입력" />
        </label>
        <label>
          희망 지역
          <select id="location" name="location">
            <option value="">전체 지역</option>
            <option value="대전">대전</option>
            <option value="세종">세종</option>
            <option value="충남">충남</option>
            <option value="서울">서울</option>
            <option value="부산">부산</option>
          </select>
        </label>
        <label>
          졸업 시기
          <input type="text" name="graduation" placeholder="졸업 시기 입력" />
        </label>
      </div>
      <label class="keyword-field">
        공고 검색어
        <input id="keyword" type="text" name="keyword" placeholder="예: 인턴, 기획" />
      </label>
      <button id="search-button" type="button">검색</button>

      <section class="jobs" aria-labelledby="job-list-title">
        <h2 id="job-list-title">공고 목록</h2>
        <div class="job-list"></div>
      </section>
    </main>
    <script>
      const locationSelect = document.querySelector("#location");
      const keywordInput = document.querySelector("#keyword");
      const searchButton = document.querySelector("#search-button");
      const jobList = document.querySelector(".job-list");
      const priorityRegions = ["대전", "세종", "충남"];

      function createTextElement(tagName, className, text) {
        const element = document.createElement(tagName);
        element.className = className;
        element.textContent = text || "";
        return element;
      }

      function renderJobs(jobs) {
        jobs.forEach((job) => {
          const card = document.createElement("article");
          card.className = "job-card";
          card.dataset.region = job.workRgnNmLst || "";
          card.dataset.remote = "";
          card.dataset.job = "";
          card.dataset.duties = "";

          const organization = createTextElement("p", "organization", job.instNm);
          const title = createTextElement("h3", "", job.recrutPbancTtl);
          const reason = createTextElement("p", "recommendation-reason", "");
          const details = document.createElement("div");
          details.className = "job-details";
          details.append(
            createTextElement("span", "", `근무지역: ${job.workRgnNmLst || ""}`),
            createTextElement("span", "", `마감일: ${job.pbancEndYmd || ""}`)
          );

          const source = job.srcUrl
            ? Object.assign(document.createElement("a"), {
                className: "source-link",
                href: job.srcUrl,
                target: "_blank",
                rel: "noreferrer",
                textContent: "원문 링크",
              })
            : createTextElement("span", "source-link", "");

          card.append(organization, title, reason, details, source);
          jobList.append(card);
        });
      }

      function getRecommendation(card) {
        const reasons = [];
        let score = 0;
        const keyword = keywordInput.value.trim().toLowerCase();

        if (priorityRegions.includes(card.dataset.region)) {
          score += 1;
          reasons.push("지역 우선 규칙");
        } else if (card.dataset.remote === "true") {
          score += 1;
          reasons.push("지역 외 재택 가능 규칙");
        }

        const searchableText = [
          card.querySelector("h3").textContent,
          card.dataset.job,
          card.dataset.duties,
        ]
          .join(" ")
          .toLowerCase();

        if (keyword && searchableText.includes(keyword)) {
          score += 1;
          reasons.push("검색 키워드 일치 규칙");
        }

        return { score, reasons };
      }

      function applyFiltersAndRecommendations() {
        const selectedLocation = locationSelect.value;
        const jobCards = Array.from(jobList.querySelectorAll(".job-card"));
        const rankedCards = jobCards
          .map((card, index) => ({ card, index, ...getRecommendation(card) }))
          .sort((a, b) => b.score - a.score || a.index - b.index);

        rankedCards.forEach(({ card, reasons }) => {
          const jobRegions = card.dataset.region
            .split(",")
            .map((region) => region.trim());
          card.hidden = selectedLocation !== "" && !jobRegions.includes(selectedLocation);
          card.querySelector(".recommendation-reason").textContent =
            `추천 이유: ${reasons.join(" · ") || "추천 규칙 미일치"}`;
          jobList.append(card);
        });
      }

      searchButton.addEventListener("click", () => {
        applyFiltersAndRecommendations();
      });

      fetch("./jobs.json")
        .then((response) => response.json())
        .then((jobs) => {
          renderJobs(jobs);
          applyFiltersAndRecommendations();
        })
        .catch(() => {
          jobList.textContent = "공고 정보를 불러오지 못했습니다.";
        });
    </script>
  </body>
</html>
